<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Studio Cedro Marcenaria</title>
    <script>
      var segments = location.pathname.split("/");
      var basePath = location.hostname.endsWith(".github.io")
        ? "/" + segments[1] + "/"
        : "/";

      sessionStorage.redirect = location.href;
      location.replace(location.origin + basePath);
    </script>
  </head>
  <body></body>
</html>
