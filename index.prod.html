<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/studioMarcenaria/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>studiomarcenaria</title>
		<script type="text/javascript">
			(function (l) {
				if (l.pathname.endsWith("/index.prod.html")) {
					window.history.replaceState(
						null,
						null,
						l.pathname.replace(/\/index\.prod\.html$/, "/") + l.search + l.hash,
					);
					return;
				}

				if (l.search[1] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (segment) {
							return segment.replace(/~and~/g, "&");
						})
						.join("?");

					window.history.replaceState(
						null,
						null,
						l.pathname.slice(0, -1) + decoded + l.hash,
					);
				}
			})(window.location);
		</script>
		<script type="module" crossorigin src="/studioMarcenaria/assets/index-Vtz66i8w.js"></script>
		<link rel="stylesheet" crossorigin href="/studioMarcenaria/assets/index-DT4fW_oo.css">
	</head>
	<body>
		<div id="root"></div>
		<script type="text/javascript">
			(function (l) {
				var devEntrypoint = document.querySelector(
					'script[src="/src/main.jsx"]',
				);
				if (l.hostname === "riqueecode.github.io" && devEntrypoint) {
					l.replace("/studioMarcenaria/index.prod.html" + l.search + l.hash);
				}
			})(window.location);
		</script>
	</body>
</html>
