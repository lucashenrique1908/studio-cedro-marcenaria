name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Vite HTML
        run: node scripts/prepare-vite-html.cjs

      - name: Build
        run: npm run build

      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Verify GitHub Pages build
        run: node scripts/verify-pages-build.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          echo "Checking ${PAGE_URL}"
          html=""

          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL "${PAGE_URL}")" && break
            sleep 10
          done

          if [ -z "$html" ]; then
            echo "Could not download the published page."
            exit 1
          fi

          printf '%s' "$html" | grep -q '/assets/' || {
            echo "Published HTML does not reference built assets."
            exit 1
          }

          if printf '%s' "$html" | grep -E 'src/main\.jsx|/src/|%VITE_BASE_URL%|%BASE_URL%'; then
            echo "Published HTML is still serving development references."
            exit 1
          fi

          asset_path="$(printf '%s' "$html" | grep -oE '/studio-cedro-marcenaria/assets/[^"]+\.js' | head -n 1)"

          if [ -z "$asset_path" ]; then
            echo "Could not find the built JavaScript asset in the published HTML."
            exit 1
          fi

          curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io${asset_path}" >/dev/null
