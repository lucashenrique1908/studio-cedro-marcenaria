name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build:pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify build
        run: npm run verify:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          echo "Checking ${PAGE_URL}"
          html=""

          for attempt in 1 2 3 4 5 6; do
            html="$(curl -fsSL "${PAGE_URL}")" && break
            sleep 10
          done

          if [ -z "$html" ]; then
            echo "Could not download the published page."
            exit 1
          fi

          if ! printf '%s' "$html" | grep -q '/assets/'; then
            if printf '%s' "$html" | grep -q '/docs/'; then
              PAGE_URL="${PAGE_URL%/}/docs/"
              echo "Root points to docs build, checking ${PAGE_URL}"
              html="$(curl -fsSL "${PAGE_URL}")"
            else
              echo "Published HTML does not reference built assets."
              exit 1
            fi
          fi

          if printf '%s' "$html" | grep -E 'src/main\.jsx|/src/|%VITE_BASE_URL%|%BASE_URL%'; then
            echo "Published HTML is still serving development references."
            exit 1
          fi

          if ! printf '%s' "$html" | grep -q 'favicon.png?v=5'; then
            echo "Published HTML does not reference the cache-busted favicon."
            exit 1
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          asset_path="$(printf '%s' "$html" | grep -oE "/${repo_name}/(docs/)?assets/[^\"]+\.js" | head -n 1)"
          favicon_path="$(printf '%s' "$html" | grep -oE "/${repo_name}/(docs/)?(assets/)?favicon[^\"]*\.png\?v=5" | head -n 1)"

          if [ -z "$asset_path" ]; then
            echo "Could not find the built JavaScript asset in the published HTML."
            exit 1
          fi

          if [ -z "$favicon_path" ]; then
            echo "Could not find the published favicon path in the HTML."
            exit 1
          fi

          curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io${asset_path}" >/dev/null
          curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io${favicon_path}" >/dev/null
