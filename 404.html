<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Studio Cedro Marcenaria</title>
    <script type="text/javascript">
      var l = window.location;
      var isGitHubPages = l.hostname.endsWith(".github.io");
      var pathSegmentsToKeep = isGitHubPages ? 1 : 0;
      var basePath = l.pathname
        .split("/")
        .slice(0, 1 + pathSegmentsToKeep)
        .join("/");

      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          basePath +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
